{
  "appId": "com.cakebar.app",
  "productName": "CakeBar",
  "directories": { "output": "dist" },
  "files": ["out/**/*", "package.json"],
  "win": {
    "target": ["nsis", "portable"],
    "icon": "build/icon.ico",
    "artifactName": "CakeBar-${version}-Setup.${ext}",
    "signAndEditExecutable": false
  },
  "nsis": { "oneClick": false, "allowToChangeInstallationDirectory": true, "shortcutName": "CakeBar" },
  "linux": {
    "target": ["AppImage"],
    "icon": "build/icon.png",
    "category": "Office",
    "artifactName": "CakeBar-${version}.${ext}"
  }
}
